<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)" />

  <!-- Outer Concentric Reactor Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="16 8" opacity="0.6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="30 15" opacity="0.8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.9" filter="url(#glow)" />

  <!-- Reactor Core Glow -->
  <circle cx="256" cy="256" r="110" fill="url(#coreGlow)" />

  <!-- Center AI Node (Pal Icon) -->
  <circle cx="256" cy="256" r="70" fill="#0f172a" stroke="#38bdf8" stroke-width="6" filter="url(#glow)" />
  <path d="M256 200 L270 240 L310 256 L270 272 L256 312 L242 272 L202 256 L242 240 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
